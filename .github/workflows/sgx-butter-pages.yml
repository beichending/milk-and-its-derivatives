name: Update and deploy SGX dairy dashboards

on:
  push:
    branches: ["main"]
    paths:
      - "sgx-butter-dashboard/*.py"
      - "sgx-butter-dashboard/config.example.json"
      - "sgx-butter-dashboard/tests/**"
      - "sgx-wmp-dashboard/*.py"
      - "sgx-wmp-dashboard/config.example.json"
      - "sgx-wmp-dashboard/tests/**"
      - ".github/workflows/sgx-butter-pages.yml"
  workflow_dispatch:
  schedule:
    # 19:45 Asia/Shanghai / Singapore time, Monday-Friday.
    - cron: "45 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare public configuration
        run: |
          cp sgx-butter-dashboard/config.example.json sgx-butter-dashboard/config.json
          cp sgx-wmp-dashboard/config.example.json sgx-wmp-dashboard/config.json

      - name: Collect SGX Butter data and rebuild dashboard
        working-directory: sgx-butter-dashboard
        run: python sgx_butter_collector.py --config config.json collect --no-notify

      - name: Collect SGX WMP data and rebuild dashboard
        working-directory: sgx-wmp-dashboard
        run: python sgx_wmp_collector.py --config config.json collect --no-notify

      - name: Persist the updated public market-data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sgx-butter-dashboard/dashboard.html \
            sgx-butter-dashboard/data/sgx_butter.sqlite3 \
            sgx-wmp-dashboard/dashboard.html \
            sgx-wmp-dashboard/data/sgx_wmp.sqlite3
          git diff --cached --quiet || git commit -m "data: refresh SGX dairy dashboards"
          git push

      - name: Prepare Pages site
        run: |
          mkdir -p _site/btr _site/wmp
          cp sgx-butter-dashboard/dashboard.html _site/btr/index.html
          cp sgx-wmp-dashboard/dashboard.html _site/wmp/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./btr/">
              <title>SGX Dairy Futures Dashboards</title>
              <style>
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  color: #101828;
                  background: #f5f7fb;
                }
                main {
                  width: min(560px, calc(100vw - 40px));
                  padding: 32px;
                  border: 1px solid #d9e2f3;
                  border-radius: 20px;
                  background: #ffffff;
                  box-shadow: 0 12px 32px rgba(16, 24, 40, 0.08);
                }
                h1 { margin: 0 0 12px; font-size: 24px; }
                p { margin: 0 0 20px; color: #475467; line-height: 1.5; }
                a {
                  display: inline-flex;
                  margin-right: 12px;
                  padding: 10px 14px;
                  border-radius: 10px;
                  color: #1849a9;
                  background: #eef4ff;
                  text-decoration: none;
                  font-weight: 700;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>SGX Dairy Futures Dashboards</h1>
                <p>Redirecting to the BTR dashboard. If it does not open automatically, choose a dashboard below.</p>
                <a href="./btr/">BTR Butter</a>
                <a href="./wmp/">WMP</a>
              </main>
            </body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
