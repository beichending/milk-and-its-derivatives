const root = document.getElementById('root');
const fmt = v => Number(v).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt2 = v => Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
const pct = v => `${Math.round(v * 100)}%`;

function makeSection(p) {
  const section = document.createElement('section');
  section.className = 'product';
  section.id = p.key;
  section.innerHTML = `<h2>${p.zh}&#36827;&#21475;&#20998;&#26512;</h2><div class="grid">
    <div class="panel"><div class="title">&#24180;&#24230;&#36827;&#21475;&#37327;&#65292;&#21315;&#21544;</div><div id="${p.key}-annual" class="chart"></div></div>
    <div class="panel"><div class="title">&#26376;&#24230;${p.zh}&#36827;&#21475;&#24635;&#37327;&#21464;&#21270;&#65292;&#21315;&#21544;</div><div id="${p.key}-monthly" class="chart"></div></div>
    <div class="panel"><div class="title">&#36817;12&#20010;&#26376;${p.zh}&#36827;&#21475;&#26469;&#28304;&#21344;&#27604;&#65292;%</div><div id="${p.key}-stacked" class="chart"></div></div>
  </div>`;
  root.appendChild(section);
}

function drawAnnual(p) {
  const chart = echarts.init(document.getElementById(`${p.key}-annual`));
  chart.setOption({
    animation: false,
    grid: { left: 70, right: 40, top: 70, bottom: 75 },
    tooltip: { trigger: 'item', formatter: d => `<b>${p.zh} ${d.name}</b><br/>&#24180;&#24230;&#36827;&#21475;&#37327;&#65306;${fmt(d.value)} &#21315;&#21544;` },
    xAxis: { type: 'value', show: false, max: value => value.max * 1.32 },
    yAxis: { type: 'category', inverse: true, axisLine: { show: true, lineStyle: { color: '#222' } }, axisTick: { show: false }, axisLabel: { color: '#003b68', fontSize: 14, formatter: v => v.replace('YTD', `YTD
(${p.latestMonthShort})`) }, data: p.annual.map(d => d.label) },
    series: [{ type: 'bar', data: p.annual.map(d => d.kmt), barWidth: 44, itemStyle: { color: '#003b68' }, label: { show: true, position: 'right', color: '#003b68', fontSize: 20, formatter: d => fmt(d.value) } }]
  });
  return chart;
}

function drawMonthly(p) {
  const chart = echarts.init(document.getElementById(`${p.key}-monthly`));
  const colors = ['#003b68', '#9ddbdd', '#f4a36b'];
  chart.setOption({
    animation: false,
    color: colors,
    grid: { left: 48, right: 8, top: 55, bottom: 55 },
    tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '' : `${fmt2(v)} &#21315;&#21544;` },
    legend: { top: 2, itemWidth: 30, itemHeight: 4, textStyle: { color: '#003b68', fontSize: 20 }, data: p.years.map(String) },
    xAxis: { type: 'category', boundaryGap: false, axisLine: { lineStyle: { color: '#222' } }, axisTick: { show: false }, axisLabel: { color: '#565656', fontSize: 18 }, data: Array.from({length: 12}, (_, i) => String(i + 1)) },
    yAxis: { type: 'value', min: 0, max: value => Math.max(40, Math.ceil(value.max / 10) * 10), interval: 10, axisLine: { show: true, lineStyle: { color: '#222' } }, axisLabel: { color: '#565656', fontSize: 18 }, splitLine: { show: false } },
    series: p.years.map((year, i) => ({ name: String(year), type: 'line', symbolSize: 8, showSymbol: false, connectNulls: false, lineStyle: { width: 4, color: colors[i] }, itemStyle: { color: colors[i] }, data: p.monthly.map(d => d[String(year)]) }))
  });
  return chart;
}

function drawStacked(p) {
  const chart = echarts.init(document.getElementById(`${p.key}-stacked`));
  const months = p.stacked.map(d => d.month.replace('-', ''));
  const series = p.categories.map(cat => ({
    name: cat.name,
    type: 'bar',
    stack: 'total',
    barWidth: 34,
    itemStyle: { color: cat.color },
    label: { show: true, color: cat.name === 'New Zealand' ? '#fff' : '#003b68', fontSize: 16, formatter: d => d.data.share > 0.05 ? pct(d.data.share) : '' },
    emphasis: { focus: 'series' },
    data: p.stacked.map(m => {
      const part = m.parts.find(x => x.name === cat.name) || { kmt: 0, share: 0 };
      return { value: part.kmt, share: part.share, month: m.month, totalKmt: m.totalKmt };
    })
  }));
  series.push({ name: 'Total', type: 'bar', barGap: '-100%', barWidth: 34, silent: true, itemStyle: { color: 'transparent' }, label: { show: true, position: 'top', color: '#003b68', fontSize: 20, formatter: d => fmt(d.value) }, data: p.stacked.map(d => d.totalKmt) });
  chart.setOption({
    animation: false,
    grid: { left: 12, right: 10, top: 62, bottom: 55 },
    legend: { top: 2, left: 0, itemWidth: 23, itemHeight: 17, textStyle: { color: '#003b68', fontSize: 15 }, data: p.categories.map(c => c.name) },
    tooltip: { trigger: 'item', formatter: d => d.seriesName === 'Total' ? '' : `<b>${d.data.month} ${d.seriesName}</b><br/>&#36827;&#21475;&#37327;&#65306;${fmt2(d.value)} &#21315;&#21544;<br/>&#21344;&#27604;&#65306;${pct(d.data.share)}<br/>&#24635;&#37327;&#65306;${fmt(d.data.totalKmt)} &#21315;&#21544;` },
    xAxis: { type: 'category', axisLine: { lineStyle: { color: '#222' } }, axisTick: { show: false }, axisLabel: { color: '#003b68', fontSize: 20, interval: 2 }, data: months },
    yAxis: { type: 'value', show: false },
    series
  });
  return chart;
}

const charts = [];
products.forEach(p => { makeSection(p); charts.push(drawAnnual(p), drawMonthly(p), drawStacked(p)); });
window.addEventListener('resize', () => charts.forEach(c => c.resize()));
</script>
